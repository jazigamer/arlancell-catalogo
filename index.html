<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Arlancell | Catálogo de celulares</title>
<meta name="description" content="Celulares disponíveis na Arlancell. Escolha o seu e peça pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f5f5f5;--muted:#9b9b9b;--line:#272727;--wa:#25c26a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{padding:26px 0 14px;display:flex;align-items:center;gap:14px}
header img{height:46px;width:auto}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
header p{color:var(--muted);font-size:.92rem}
.dest{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;max-width:1120px;margin:0 auto;scrollbar-width:none}
.dest span{white-space:nowrap;font-size:.84rem;border:1px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;font:inherit;color:inherit;padding:11px 14px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:500;font-size:.9rem;padding:6px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:18px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:#555}
.card.off{opacity:.55}
.ph{position:relative;aspect-ratio:1/1;background:#1b1b1b;display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph svg{width:30%;opacity:.3}
.info{padding:12px 14px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.tag{font-size:.78rem;color:var(--muted)}
.info h3{font-size:1.02rem;font-weight:700;line-height:1.3}
.info .d{font-size:.87rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:auto;padding-top:8px;font-weight:800;font-size:1.25rem}
.out{color:var(--muted);font-size:.85rem;font-weight:500}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
dialog{border:0;border-radius:18px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--card);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.75)}
.m{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:640px){.m{grid-template-columns:1fr}}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:#fff}
.det{padding:20px;display:flex;flex-direction:column;gap:10px}
.det h2{font-size:1.3rem;line-height:1.25}
.det .price{font-size:1.6rem;padding:0}
.det p{color:var(--muted);white-space:pre-line;font-size:.95rem}
.buy{margin-top:auto;display:block;text-align:center;background:var(--wa);color:#04140a;font-weight:800;text-decoration:none;padding:13px;border-radius:12px}
.x{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:1.3rem;cursor:pointer}
footer{border-top:1px solid var(--line);padding:22px 0 96px;color:var(--muted);font-size:.9rem}
footer a{color:var(--ink)}
.fab{position:fixed;right:16px;bottom:16px;background:var(--wa);color:#04140a;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="wrap"><header>
  <img src="logo.png" alt="" onerror="this.remove()">
  <div><div class="logo" id="loja">Arlancell</div><p>Celulares disponíveis na loja. Escolha o seu e chame no WhatsApp.</p></div>
</header></div>
<div class="dest" id="dest"></div>
<div class="bar"><div class="wrap">
  <input type="search" id="q" placeholder="Buscar celular ou modelo" aria-label="Buscar celular">
  <div class="chips" id="chips"></div>
</div></div>
<main class="wrap"><div class="grid" id="grid"></div></main>
<footer><div class="wrap"><span id="rodape"></span></div></footer>
<a class="fab" id="fab" target="_blank" rel="noopener">WhatsApp</a>
<dialog id="dlg"><button class="x" id="fechar" aria-label="Fechar">×</button><div class="m" id="m"></div></dialog>

<script>
let LOJA = {}, PRODUTOS = [], cat = "Todos", busca = "";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const wa = txt => LOJA.whatsapp
  ? `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(txt)}`
  : (LOJA.whatsapp_link || "#") + ((LOJA.whatsapp_link || "").includes("?") ? "&" : "?") + "text=" + encodeURIComponent(txt);
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>';
const foto = (src, alt) => `${ICON}<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`;

function chips(){
  const cats = ["Todos", ...new Set(PRODUTOS.map(p => p.condicao).filter(Boolean))];
  $("#chips").innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("") : "";
}
function lista(){
  const t = busca.trim().toLowerCase();
  const itens = PRODUTOS.map((p,i) => ({p,i}))
    .filter(({p}) => (cat==="Todos" || p.condicao===cat) && (p.nome+" "+(p.desc||"")).toLowerCase().includes(t))
    .sort((a,b) => (b.p.disponivel!==false) - (a.p.disponivel!==false));
  $("#grid").innerHTML = itens.length ? itens.map(({p,i}) => `
    <button class="card ${p.disponivel===false?'off':''}" data-i="${i}">
      <div class="ph">${foto((p.fotos||[])[0] || "", p.nome)}</div>
      <div class="info">
        <span class="tag">${esc(p.condicao)}</span>
        <h3>${esc(p.nome)}</h3>
        <span class="d">${esc((p.desc||"").replace(/\n/g," · "))}</span>
        <span class="price">${p.disponivel===false ? '<span class="out">Indisponível</span>' : brl(p.preco)}</span>
      </div></button>`).join("")
    : `<p class="empty">${PRODUTOS.length ? "Nenhum celular encontrado. Tente outra busca." : "Catálogo sendo atualizado. Chame a gente no WhatsApp para ver o que tem hoje."}</p>`;
}
function abrir(i){
  const p = PRODUTOS[i], f = p.fotos || [], on = p.disponivel !== false;
  $("#m").innerHTML = `
    <div><div class="ph" id="main">${foto(f[0] || "", p.nome)}</div>
      ${f.length>1 ? `<div class="thumbs">${f.map((x,k)=>`<img src="${esc(x)}" alt="Foto ${k+1}" class="${k?'':'on'}" data-f="${esc(x)}">`).join("")}</div>` : ""}</div>
    <div class="det">
      <span class="tag">${esc(p.condicao)}</span><h2>${esc(p.nome)}</h2>
      <div class="price">${on ? brl(p.preco) : '<span class="out">Indisponível</span>'}</div>
      <p>${esc(p.desc)}</p>
      ${on ? `<a class="buy" target="_blank" rel="noopener" href="${wa(`Olá! Tenho interesse no ${p.nome} (${brl(p.preco)}). Ainda está disponível?`)}">Pedir pelo WhatsApp</a>` : ""}
    </div>`;
  $("#dlg").showModal();
}
$("#chips").onclick = e => { const b = e.target.closest(".chip"); if(b){ cat = b.dataset.c; chips(); lista(); } };
$("#q").oninput = e => { busca = e.target.value; lista(); };
$("#grid").onclick = e => { const c = e.target.closest(".card"); if(c) abrir(+c.dataset.i); };
$("#m").onclick = e => {
  const t = e.target.closest(".thumbs img"); if(!t) return;
  $("#main").innerHTML = foto(t.dataset.f, "");
  document.querySelectorAll(".thumbs img").forEach(x => x.classList.toggle("on", x===t));
};
$("#fechar").onclick = () => $("#dlg").close();
$("#dlg").onclick = e => { if(e.target === $("#dlg")) $("#dlg").close(); };

fetch("produtos.json?v=" + Date.now()).then(r => r.json()).then(d => {
  LOJA = d.loja || {}; PRODUTOS = d.produtos || [];
  $("#loja").textContent = LOJA.nome || "Arlancell";
  $("#fab").href = wa("Olá! Vim pelo catálogo da " + (LOJA.nome || "loja") + ".");
  $("#dest").innerHTML = (LOJA.destaques || []).map(t => `<span>${esc(t)}</span>`).join("");
  const rod = [LOJA.endereco, LOJA.horario].filter(Boolean).map(esc).join(" · ");
  $("#rodape").innerHTML = [esc(LOJA.nome || ""), rod, LOJA.mapa ? `<a href="${esc(LOJA.mapa)}" target="_blank" rel="noopener">Como chegar</a>` : ""].filter(Boolean).join(" · ");
  chips(); lista();
}).catch(() => { $("#grid").innerHTML = '<p class="empty">Não foi possível carregar o catálogo. Abra pelo link do site, não clicando no arquivo.</p>'; });
</script>
</body>
</html>
